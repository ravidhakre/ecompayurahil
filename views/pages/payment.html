{{HEAD}}
{{HEADER}}
<main id="main-content">
  <section class="section" style="padding-top:52px">
    <div class="container">
      <div class="payment-wrap">
        <div class="checkout-steps" style="justify-content:center;margin-bottom:32px" aria-label="Checkout progress">
          <span class="step-dot done"><i>1</i> Cart</span>
          <span class="sep" aria-hidden="true"></span>
          <span class="step-dot done"><i>2</i> Delivery</span>
          <span class="sep" aria-hidden="true"></span>
          <span class="step-dot active"><i>3</i> Payment</span>
        </div>

        <div class="payment-card" id="paymentCard">
          <div class="pay-brand">
            <img src="/assets/logo.svg" alt="Arts Book" width="150" height="40">
            <span class="payu-badge">
              <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect x="5" y="10" width="14" height="10" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></svg>
              Secure PayU checkout
            </span>
          </div>
          <div id="paymentBody">
            <div class="payment-status" role="status">
              <span class="status-icon"><span class="btn-spinner"></span></span>
              <h1>Preparing your payment…</h1>
              <p>Please wait while we connect to the secure payment gateway.</p>
            </div>
          </div>
        </div>

        <div class="pay-trust">
          <span>🔒 256-bit SSL encryption</span>
          <span>🛡 PCI-DSS compliant</span>
          <span>↩ {{RETURNS_DAYS}}-day returns</span>
          <span>💬 Need help? <a href="mailto:{{EMAIL}}" style="text-decoration:underline">Email us</a></span>
        </div>
      </div>
    </div>
  </section>
</main>
{{FOOTER}}
